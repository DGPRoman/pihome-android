name: Contract

# The hub client against a real hub. Pull requests run it against the hub commit
# pinned below, so that a red run here is about this repository's change; once a
# week it runs against the hub's main, to notice the hub moving before the pin does.
#
# Move the pin when the client follows a change in the hub, in the same pull
# request as the change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Least privilege: nothing here needs to write to either repository.
permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_REF: 27efadd981b8f5d1fbd39121ce5f0861b905cd77

jobs:
  contract:
    name: Contract (pihome-hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DGPRoman/pihome-hub
          ref: ${{ github.event_name == 'schedule' && 'main' || env.HUB_REF }}
          path: pihome-hub
          persist-credentials: false

      # The Python the hub's own CI proves it on.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pihome-hub/requirements/base.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Lint the script
        run: shellcheck --severity=style scripts/contract-test.sh

      # Starts the hub on loopback with throwaway keys and an admin of its own,
      # runs the contract tests and prints the hub's log if they fail.
      - name: Contract tests
        env:
          PIHOME_HUB_DIR: pihome-hub
          PYTHON: python
        run: scripts/contract-test.sh
